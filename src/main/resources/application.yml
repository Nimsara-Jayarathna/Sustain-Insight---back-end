spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=${PGSSLMODE:require}
    username: ${PGUSER}
    password: ${PGPASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
    out-of-order: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  server:
    port: ${PORT:5000}

server:
  port: ${PORT}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

newsapi:
  url: https://newsapi.org/v2
  apiKey: ${NEWS_API_KEY}
  query: (sustainability OR climate OR renewable OR environment OR ESG OR carbon)
  sortBy: publishedAt
  language: en
  pageSize: ${NEWS_API_PAGE_SIZE:50}
  maxPages: ${NEWS_API_MAX_PAGES:2}
  pageDelayMs: ${NEWS_API_PAGE_DELAY_MS:2000}

guardian:
  url: https://content.guardianapis.com
  apiKey: ${GUARDIAN_API_KEY}
  language: en


feed:
  hoursWindow: ${FEED_HOURS_WINDOW}

pagination:
  defaultSize: ${PAGINATION_DEFAULT_SIZE}
  maxSize: ${PAGINATION_MAX_SIZE}

articles:
  latest:
    defaultLimit: ${LATEST_DEFAULT_LIMIT}
    maxLimit: ${LATEST_MAX_LIMIT}

fetching:
  enabled: ${NEWS_FETCHING_ENABLED}
  delay: ${NEWS_FETCHING_DELAY}
  scheduled:
    limit: ${NEWS_FETCHING_SCHEDULED_LIMIT}

synthesis:
  trigger:
    threshold: ${SYNTHESIS_TRIGGER_THRESHOLD}

clustering:
  tfidf:
    threshold: ${CLUSTERING_TFIDF_THRESHOLD}

app:
  frontend-url: ${FRONTEND_URL}
  brand:
    name: ${BRAND_NAME:Sustain Insight}
  email:
    provider: ${EMAIL_PROVIDER:brevo}
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:Sustain Insight}
    brevo:
      api-key: ${BREVO_API_KEY:}

jwt:
  secret: ${JWT_KEY}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION}       
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION}   

security:
  password:
    argon2:
      salt-length: ${SECURITY_PASSWORD_ARGON2_SALT_LENGTH:16}
      hash-length: ${SECURITY_PASSWORD_ARGON2_HASH_LENGTH:32}
      parallelism: ${SECURITY_PASSWORD_ARGON2_PARALLELISM:1}
      memory: ${SECURITY_PASSWORD_ARGON2_MEMORY:8192}
      iterations: ${SECURITY_PASSWORD_ARGON2_ITERATIONS:2}

openai:
  api:
    key: ${OPEN_AI_KEY}

gemini:
  api:
    key: ${GEMINI_API_KEY}
