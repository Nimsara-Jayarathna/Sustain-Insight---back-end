name: Backend Staging CI/CD

on:
  pull_request:
    branches: ["staging"]
  push:
    branches: ["staging"]

concurrency:
  group: sustain-insight-be-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_NAME: sustain-insight-be

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and package
        run: ./mvnw -B clean verify

  build:
    name: Build Image
    if: ${{ github.event_name == 'push' }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive deployment metadata
        run: |
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=stg" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f Dockerfile.staging \
            -t "$IMAGE_REPO:$DEPLOY_TAG" \
            -t "$IMAGE_REPO:${GITHUB_SHA::7}" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE_REPO:$DEPLOY_TAG"
          docker push "$IMAGE_REPO:${GITHUB_SHA::7}"

  deploy:
    name: Deploy
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.SSH_USER }}
      NPM_NET_NAME: ${{ vars.NPM_NET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive deployment metadata
        run: |
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=stg" >> "$GITHUB_ENV"
          echo "APP_DIR=/var/www/sustain-insight-backend-stg" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=sustain-insight-stg" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=${APP_NAME}-stg" >> "$GITHUB_ENV"
          echo "DB_CONTAINER_NAME=sustain-insight-db-stg" >> "$GITHUB_ENV"
          echo "NETWORK_ALIAS=${APP_NAME}-stg" >> "$GITHUB_ENV"
          echo "INTERNAL_NET_NAME=sustain_insight_stg_internal" >> "$GITHUB_ENV"

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Validate deployment secrets
        run: |
          if [ -z "${APP_ENV_FILE:-}" ]; then echo "APP_ENV_FILE secret is required" >&2; exit 1; fi
          if [ -z "${SSH_HOST:-}" ]; then echo "SSH_HOST secret is required" >&2; exit 1; fi
          if [ -z "${SSH_USER:-}" ]; then echo "SSH_USER secret is required" >&2; exit 1; fi
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then echo "SSH_PRIVATE_KEY secret is required" >&2; exit 1; fi
          if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
            echo "SSH_PORT must be a numeric repository secret" >&2
            exit 1
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote deployment directory
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "sudo mkdir -p '$APP_DIR' && sudo chown '$SSH_USER:$SSH_USER' '$APP_DIR'"

      - name: Upload compose file
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          scp $SSH_OPTS -P "$SSH_PORT" docker-compose.staging.yml \
            "$SSH_USER@$SSH_HOST:$APP_DIR/docker-compose.staging.yml"

      - name: Upload environment file
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          printf '%s\n' "$APP_ENV_FILE" | ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > '$APP_DIR/.env'"

      - name: Run Docker Compose remotely
        run: |
          SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' IMAGE='$IMAGE_REPO:$DEPLOY_TAG' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' CONTAINER_NAME='$CONTAINER_NAME' DB_CONTAINER_NAME='$DB_CONTAINER_NAME' NETWORK_ALIAS='$NETWORK_ALIAS' INTERNAL_NET_NAME='$INTERNAL_NET_NAME' NPM_NET_NAME='${NPM_NET_NAME:-npm_default}' bash -s" <<'EOF_REMOTE'
          set -euo pipefail

          cd "$APP_DIR"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is required on the target server" >&2
            exit 1
          fi

          if docker compose version >/dev/null 2>&1; then
            DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose"
          else
            echo "Docker Compose is required on the target server" >&2
            exit 1
          fi

          if ! docker network inspect "$NPM_NET_NAME" >/dev/null 2>&1; then
            docker network create --driver bridge "$NPM_NET_NAME"
          fi

          IMAGE="$IMAGE" \
          CONTAINER_NAME="$CONTAINER_NAME" \
          DB_CONTAINER_NAME="$DB_CONTAINER_NAME" \
          NETWORK_ALIAS="$NETWORK_ALIAS" \
          INTERNAL_NET_NAME="$INTERNAL_NET_NAME" \
          NPM_NET_NAME="$NPM_NET_NAME" \
          $DC -p "$COMPOSE_PROJECT_NAME" -f docker-compose.staging.yml pull

          IMAGE="$IMAGE" \
          CONTAINER_NAME="$CONTAINER_NAME" \
          DB_CONTAINER_NAME="$DB_CONTAINER_NAME" \
          NETWORK_ALIAS="$NETWORK_ALIAS" \
          INTERNAL_NET_NAME="$INTERNAL_NET_NAME" \
          NPM_NET_NAME="$NPM_NET_NAME" \
          $DC -p "$COMPOSE_PROJECT_NAME" -f docker-compose.staging.yml up -d --remove-orphans

          docker image prune -f
          EOF_REMOTE
