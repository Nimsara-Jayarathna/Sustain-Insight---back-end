services:
  backend:
    image: ${IMAGE}
    container_name: ${CONTAINER_NAME:-sustain-insight-be-stg}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${PORT:-5000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:${PORT:-5000}/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      sustain_insight_internal:
      npm_external:
        aliases:
          - ${NETWORK_ALIAS:-sustain-insight-be-stg}

  postgres:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-sustain-insight-db-stg}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sustain_insight_internal

volumes:
  postgres-data:

networks:
  sustain_insight_internal:
    name: ${INTERNAL_NET_NAME:-sustain_insight_stg_internal}
    driver: bridge
    internal: true
  npm_external:
    external: true
    name: ${NPM_NET_NAME:-npm_default}
